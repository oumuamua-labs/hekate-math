name: CI workflow
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    name: CI checks (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            lane: pmull
            rustflags: "-C target-feature=+aes"
            features: "--all-features"
          - os: ubuntu-24.04-arm
            lane: pmull-ct
            rustflags: "-C target-feature=+aes"
            features: ""
          - os: ubuntu-24.04-arm
            lane: fallback
            rustflags: ""
            features: "--all-features"
          - os: ubuntu-24.04
            lane: x86
            rustflags: ""
            features: "--all-features"
          - os: ubuntu-24.04
            lane: x86-ct
            rustflags: ""
            features: ""
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.lane }}

      - name: Rustfmt
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy ${{ matrix.features }} --all-targets -- -D warnings

      - name: Assert PMULL path is live
        if: startsWith(matrix.lane, 'pmull')
        run: cargo rustc --release -- --print cfg | grep -qx pmull

      - name: Assert PMULL path is off
        if: ${{ !startsWith(matrix.lane, 'pmull') }}
        run: |
          cfg=$(cargo rustc --release -- --print cfg)
          ! grep -qx pmull <<< "$cfg"

      - name: Build no_std
        run: cargo build --no-default-features

      - name: Run Tests
        run: cargo test ${{ matrix.features }} --release

      - name: Install cargo-audit and cargo-deny
        if: matrix.lane == 'pmull'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit, cargo-deny

      - name: Cargo audit
        if: matrix.lane == 'pmull'
        run: cargo audit

      - name: Cargo deny check
        if: matrix.lane == 'pmull'
        run: cargo deny check
