[package]
name = "hekate-math"
version = "0.12.1"
edition = "2024"
build = "build/main.rs"
authors = [
    "Oumuamua Labs <info@oumuamua.dev>",
    "Andrei Kochergin <andrei@oumuamua.dev>",
]
repository = "https://github.com/oumuamua-labs/hekate-math"
homepage = "https://github.com/oumuamua-labs/hekate-math"
description = "Formally verified binary tower fields (F(2^k) to F(2^256)), constant-time by default, with hardware carry-less multiplication. For Sumcheck, GKR-based provers, and Binius protocols."
keywords = ["cryptography", "zk", "binary-fields", "simd", "binius"]
categories = ["cryptography", "no-std", "mathematics", "algorithms", "science"]
license = "Apache-2.0"

[lib]
crate-type = ["rlib"]

[features]
default = ["std", "parallel"]
std = []
parallel = ["dep:rayon"]
table-math = []

[dependencies]
rayon = { version = "1.11", optional = true }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
zeroize = { version = "1.8", default-features = false, features = ["derive"] }

[dev-dependencies]
rand = "0.10"
proptest = "1.9"
criterion = "0.8"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full"] }
vstd = "=0.0.0-2026-08-30-0159"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)'] }

[[test]]
name = "verus_exec"
path = "verus/exec/main.rs"

[[bench]]
name = "field_ops"
harness = false

[[bench]]
name = "basis_conversion"
harness = false

[[bench]]
name = "poly_arithmetic"
harness = false

[[bench]]
name = "promote"
harness = false
